version: "3.9"

services:
  postgres-rampart:
    image: postgres:16
    container_name: postgres-rampart
    restart: always
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-rampart:/var/lib/postgresql/data
    networks:
      - rampart

  redis-rampart:
    image: redis:7
    container_name: redis-rampart
    restart: always
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes" ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-rampart:/data
    networks:
      - rampart

  pgadmin-rampart:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-rampart
    restart: always
    depends_on:
      - postgres-rampart
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - ~/.config/rampart-pgadmin/servers.json:/pgadmin4/servers.json
      - pgadmin-rampart:/var/lib/pgadmin
    networks:
      - rampart

networks:
  rampart:
    name: rampart
    external: true

volumes:
  postgres-rampart:
  redis-rampart:
  pgadmin-rampart:
